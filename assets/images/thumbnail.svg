<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="120" cy="70" rx="45" ry="25"/>
    <ellipse cx="150" cy="65" rx="35" ry="25"/>
    <ellipse cx="90" cy="75" rx="30" ry="20"/>

    <ellipse cx="480" cy="90" rx="55" ry="30"/>
    <ellipse cx="520" cy="80" rx="40" ry="28"/>
    <ellipse cx="440" cy="95" rx="35" ry="22"/>
  </g>

  <!-- Distant Mountains -->
  <polygon points="180,260 280,140 380,260" fill="#64748B"/>
  <polygon points="280,140 305,170 280,165 255,170" fill="#F8FAFC"/>
  <polygon points="80,260 170,160 260,260" fill="#475569"/>

  <!-- Ground -->
  <rect x="0" y="260" width="640" height="30" fill="#38B000"/>
  <rect x="0" y="275" width="640" height="15" fill="#22C55E"/>
  <rect x="0" y="290" width="640" height="70" fill="#8B4513"/>

  <!-- Blocks -->
  <g transform="translate(180, 180)">
    <!-- Question Block -->
    <rect x="40" y="0" width="40" height="40" fill="#F59E0B" stroke="#78350F" stroke-width="3" rx="4"/>
    <text x="60" y="28" fill="#FFFFFF" font-family="monospace" font-size="26" font-weight="bold" text-anchor="middle">?</text>
    <!-- Brick Blocks -->
    <rect x="0" y="0" width="40" height="40" fill="#B45309" stroke="#451A03" stroke-width="3" rx="4"/>
    <rect x="80" y="0" width="40" height="40" fill="#B45309" stroke="#451A03" stroke-width="3" rx="4"/>
  </g>

  <!-- Pipe -->
  <g transform="translate(450, 190)">
    <rect x="0" y="0" width="56" height="24" fill="#22C55E" stroke="#14532D" stroke-width="3" rx="3"/>
    <rect x="6" y="24" width="44" height="48" fill="#16A34A" stroke="#14532D" stroke-width="3"/>
    <rect x="12" y="0" width="8" height="72" fill="#86EFAC"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(320, 75)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-180" y="-35" width="360" height="70" fill="#1E293B" stroke="#F59E0B" stroke-width="4" rx="10"/>
    <text y="-5" fill="#FBBF24" font-family="'Courier New', monospace" font-size="26" font-weight="900" letter-spacing="3">SUPER ADVENTURE</text>
    <text y="24" fill="#38BDF8" font-family="'Courier New', monospace" font-size="20" font-weight="900" letter-spacing="4">WORLD</text>
  </g>
</svg>
